<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Time</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="overlay"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/>
        <path d="M12 7v5l3.2 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand__name">WORLD TIME</span>
    </div>
    <div class="topbar__right">
      <div class="topbar__date" id="dateLabel"></div>
      <button class="icon-btn theme-btn" id="themeDayBtn" aria-label="Day theme" title="Day theme">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 2.5v2.3M12 19.2v2.3M21.5 12h-2.3M4.8 12H2.5M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn theme-btn" id="themeNightBtn" aria-label="Night theme" title="Night theme">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a7 7 0 0 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-btn" id="plannerBtn" aria-label="Compare times" title="Compare times" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 12h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="12.5" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="City settings" title="City settings">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
          <rect x="14" y="3" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
          <rect x="3" y="14" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
          <rect x="14" y="14" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="hero">
    <div class="hero__label" id="heroLabel">LOCAL</div>
    <div class="hero__clock" id="heroClock"></div>
  </main>

  <!-- Planning mode: drag the anchor city to any time of day and see what
       that same instant is for every other tracked city. Hidden/inert
       until the "Compare times" button above opens it. -->
  <div class="planner" id="planner" hidden>
    <div class="planner__head">
      <div class="planner__anchor" id="plannerAnchor">—</div>
      <div class="planner__daystep">
        <button class="planner__day-btn" id="plannerPrevDay" aria-label="Previous day">‹</button>
        <span class="planner__day-label" id="plannerDayLabel">—</span>
        <button class="planner__day-btn" id="plannerNextDay" aria-label="Next day">›</button>
      </div>
      <button class="planner__exit" id="plannerExit">Now</button>
    </div>
    <div class="planner__track" id="plannerTrack">
      <div class="planner__ticks" id="plannerTicks"></div>
      <div class="planner__handle" id="plannerHandle">
        <span class="planner__handle-time" id="plannerHandleTime">00:00</span>
      </div>
    </div>
  </div>

  <footer class="ticker" id="ticker" aria-hidden="true">
    <div class="ticker__track" id="tickerTrack"></div>
  </footer>

  <div class="scene-caption" id="sceneCaption"></div>

  <!-- Settings panel -->
  <div class="panel" id="panel" hidden>
    <div class="panel__card">
      <div class="panel__header">
        <h2>Cities</h2>
        <button class="icon-btn" id="closePanelBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="panel__hero-row">
        <div class="panel__hero-info">
          <span class="panel__hero-label">Hero city</span>
          <span class="panel__hero-value" id="heroSourceValue">—</span>
        </div>
        <button class="panel__hero-reset" id="heroResetBtn" hidden>Use automatic</button>
      </div>

      <div class="panel__hero-row panel__theme-row">
        <span class="panel__hero-label">Theme</span>
        <div class="panel__theme-options" id="themeOptions">
          <button data-mode="auto" title="Light or dark, based on the hero city's current daylight">Auto (daylight)</button>
          <button data-mode="system" title="Match this device's system appearance setting">System</button>
          <button data-mode="day">Day</button>
          <button data-mode="night">Night</button>
        </div>
      </div>

      <div class="panel__search">
        <input id="citySearch" type="text" placeholder="Search a city or timezone (e.g. Berlin, Asia/Dubai)" autocomplete="off" />
        <div class="panel__results" id="searchResults" hidden></div>
      </div>

      <p class="panel__limit-msg" id="limitMsg" hidden></p>

      <ul class="panel__list" id="cityList"></ul>

      <p class="panel__hint">Changes apply immediately — no restart needed. Drag the ⠿ handle, or use the arrows, to reorder. 4–6 cities. Add your own photo of a city's landmark — it replaces the generated skyline as that city's background.</p>
    </div>
  </div>

  <input type="file" id="monumentFileInput" accept="image/*" hidden />

  <script src="cities-db.js"></script>
  <script src="app.js"></script>
</body>
</html>
